<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>沖繩行程編輯｜版本 B</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f6f0;color:#202424;font-family:Arial,'Noto Sans TC',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;min-height:100dvh;padding:22px 16px 100px}.k{font-size:10px;letter-spacing:.24em;color:#78b6b2;font-weight:800}.title{font:400 34px Georgia,'Noto Serif TC',serif;color:#183f46;margin:7px 0 4px}.sub{font-size:11px;color:#8a9390}.day{display:flex;gap:8px;overflow:auto;margin:18px 0}.day button{border:0;background:white;color:#7b8582;border-radius:999px;padding:9px 15px;font-weight:800;font-size:11px;white-space:nowrap}.day .on{background:#183f46;color:white}.stop{display:grid;grid-template-columns:68px 20px 1fr;gap:12px}.rail{grid-column:2;position:relative}.rail:after{content:'';position:absolute;left:9px;top:20px;bottom:-20px;width:1px;background:#d8dfdc}.dot{width:18px;height:18px;border-radius:50%;border:2px solid #78b6b2;background:#f7f6f0;position:relative;z-index:2;margin-top:2px}.arrive{font:900 15px monospace;color:#183f46;text-align:right}.small{font-size:9px;color:#909996;margin-top:3px;text-align:right}.card{background:white;border:1px solid #e2e6e4;border-radius:22px;padding:15px;box-shadow:0 8px 22px #183f4608}.name{font-weight:900;color:#183f46;font-size:16px}.hint{font-size:10px;color:#8b9491;margin-top:4px}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid #edf0ee}.tag{font-size:9px;font-weight:900;color:#183f46;background:#eef6f4;padding:6px 9px;border-radius:999px}.edit{border:1px solid #dfe5e2;background:#fff;color:#183f46;border-radius:999px;padding:6px 10px;font-size:9px;font-weight:900}.leg{grid-column:3;background:#edf6f4;border-radius:16px;padding:10px 12px;margin:4px 0 14px;display:grid;grid-template-columns:1fr auto;gap:6px;color:#183f46}.leg small{font-size:9px;color:#71807c}.leg strong{font-size:10px}.leg a{font-size:9px;color:#183f46;text-decoration:none}.fab{position:fixed;right:20px;bottom:24px;border:0;background:#183f46;color:white;border-radius:999px;padding:13px 18px;font-weight:900;box-shadow:0 10px 28px #183f4650}.sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center}.sheet.show{display:flex}.panel{width:min(720px,100%);max-height:92dvh;overflow:auto;background:white;border-radius:28px 28px 0 0;padding:20px}.grab{width:38px;height:4px;border-radius:4px;background:#d7ddda;margin:0 auto 15px}.panel h2{font:700 22px Georgia;color:#183f46;margin:0 0 15px}.hintbox{background:#183f46;color:#fff;border-radius:18px;padding:13px;font-size:10px;line-height:1.6;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:9px;font-weight:900;color:#78837f;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #dfe5e2;border-radius:13px;background:#f8f9f7;outline:none}.full{grid-column:1/-1}.foot{display:flex;gap:8px;margin-top:14px}.foot button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:900}.cancel{background:#eef0ee}.save{background:#183f46;color:white}@media(max-width:480px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.stop{grid-template-columns:52px 20px 1fr}.arrive{font-size:13px}.leg{grid-column:3}}</style></head><body><main class="app"><div class="k">ITINERARY EDITOR · VERSION B</div><div class="title">時間軸＋路段編輯</div><div class="sub">把「景點」和「景點之間的移動」分開管理；最適合未來自動接 Google Maps 路線資料。</div><div class="day"><button class="on">DAY 3 · 10/25</button><button>DAY 1</button><button>DAY 2</button><button>DAY 4</button></div><div id="timeline"></div></main><button class="fab" onclick="openNew()">＋ 新增行程</button><div class="sheet" id="sheet"><section class="panel"><div class="grab"></div><h2 id="modalTitle">修改行程</h2><div class="hintbox">這個版本將資料分成兩層：<b>景點本身</b>（抵達／停留／離開）＋ <b>路段</b>（交通方式／距離／移動時間）。未來 Google Maps 更新路況時，只更新路段資料即可。</div><div class="grid"><div class="field full"><label>地點</label><input id="name"></div><div class="field"><label>抵達</label><input id="arrive" type="time"></div><div class="field"><label>停留</label><input id="stay" placeholder="1 小時"></div><div class="field"><label>交通方式</label><select id="mode"><option>計程車</option><option>單軌電車</option><option>大眾運輸</option><option>徒步</option><option>觀光巴士</option></select></div><div class="field"><label>移動時間</label><input id="travel" placeholder="20 分鐘"></div><div class="field"><label>距離</label><input id="dist" placeholder="12.8 km"></div></div><div class="foot"><button class="cancel" onclick="closeSheet()">取消</button><button class="save" onclick="save()">儲存</button></div></section></div><script>const data=[{name:'波上宮',arrive:'09:14',stay:'50 分鐘',mode:'計程車',travel:'25 分鐘',dist:'17.2 km',hint:'若狹海邊斷崖'},{name:'沖繩寶可夢中心',arrive:'10:54',stay:'1 小時',mode:'計程車',travel:'20 分鐘',dist:'12.8 km',hint:'永旺夢樂城來客夢 1F'},{name:'PARCO CITY',arrive:'12:19',stay:'2.5 小時',mode:'計程車',travel:'15 分鐘',dist:'9.3 km',hint:'浦添西海岸海景商城'}];let edit=-1;function render(){timeline.innerHTML=data.map((x,i)=>`<div class="stop"><div><div class="arrive">${x.arrive}</div><div class="small">抵達</div></div><div class="rail"><div class="dot"></div></div><div class="card"><div class="name">${x.name}</div><div class="hint">${x.hint}</div><div class="bar"><span class="tag">停留 ${x.stay}</span><button class="edit" onclick="editItem(${i})">✎ 編輯</button></div></div>${i<data.length-1?`<div></div><div></div><div class="leg"><div><strong>→ ${data[i+1].name}</strong><br><small>${x.mode} · ${x.travel} · ${x.dist}</small></div><div><a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(x.name+' 沖繩')}&destination=${encodeURIComponent(data[i+1].name+' 沖繩')}" target="_blank">Google Maps ↗</a></div></div>`:''}</div>`).join('')}function editItem(i){edit=i;const x=data[i];modal(x,'修改景點')}function openNew(){edit=-1;modal({name:'',arrive:'12:00',stay:'1 小時',mode:'計程車',travel:'20 分鐘',dist:'',hint:''},'新增景點')}function modal(x,t){modalTitle.textContent=t;name.value=x.name;arrive.value=x.arrive;stay.value=x.stay;mode.value=x.mode;travel.value=x.travel;dist.value=x.dist;sheet.classList.add('show')}function closeSheet(){sheet.classList.remove('show')}function save(){const x={name:name.value,arrive:arrive.value,stay:stay.value,mode:mode.value,travel:travel.value,dist:dist.value};if(edit<0)data.push(x);else data[edit]={...data[edit],...x};render();closeSheet()}render()</script></body></html>
