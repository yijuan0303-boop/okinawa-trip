name: One-time overview all pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final UI patch
        run: python patch_ui.py
      - name: Commit final UI
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f patch_ui.py .github/workflows/one-time-overview-all-pages.yml final-ui-trigger.txt workflow-test-trigger.txt ui-final-trigger.txt ui-rebuild-trigger-2.txt ui-rebuild-trigger.txt trigger-ui-final.txt
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore preferred editorial UI and add map'
          git push
