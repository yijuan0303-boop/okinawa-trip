name: Update Taiwan Bank JPY rate

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update website and fetch Taiwan Bank rate
        shell: python
        run: |
          import csv
          import io
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          # Patch the existing website so GitHub Pages reads same-origin rate.json.
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          start = html.find('        const refreshBotRate = async () => {')
          end_marker = '         };'
          end = html.find(end_marker, start)
          if start != -1 and end != -1:
              end += len(end_marker)
              new_fn = '''        const refreshBotRate = async () => {
           rateLoading.value = true;
           try {
             // GitHub Pages is static, so read the same-origin JSON generated by GitHub Actions.
             const res = await fetch('./rate.json?ts=' + Date.now(), { cache: 'no-store' });
             if (!res.ok) throw new Error('rate.json request failed');
             const data = await res.json();
             const spotSell = Number(data.spotSell);
             const cashSell = Number(data.cashSell);
             if (!Number.isFinite(spotSell) || !Number.isFinite(cashSell)) throw new Error('invalid rate');
             botRateSell.value = spotSell;
             botCashSell.value = cashSell;
             exchangeRate.value = spotSell;
             botRateUpdated.value = data.updatedAt || '';
             localStorage.setItem('okinawaBotRate', JSON.stringify({
               botRateSell: spotSell,
               botCashSell: cashSell,
               botRateUpdated: botRateUpdated.value,
               source: '臺灣銀行'
             }));
           } catch (e) {
             try {
               const cached = JSON.parse(localStorage.getItem('okinawaBotRate'));
               if (cached) {
                 botRateSell.value = Number(cached.botRateSell) || null;
                 botCashSell.value = Number(cached.botCashSell) || null;
                 botRateUpdated.value = cached.botRateUpdated || '';
                 if (botRateSell.value) exchangeRate.value = botRateSell.value;
                 alert('目前無法取得最新臺銀匯率，已保留上次成功更新的資料。');
               } else {
                 throw e;
               }
             } catch (_) {
               alert('目前無法取得臺銀匯率，請稍後再試。');
             }
           } finally {
             rateLoading.value = false;
           }
         };'''
              html = html[:start] + new_fn + html[end:]
              path.write_text(html, encoding='utf-8')

          # Fetch Taiwan Bank's official CSV server-side (no browser CORS issue).
          url = 'https://rate.bot.com.tw/xrt/flcsv/0/day'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read().decode('utf-8-sig')

          jpy = None
          for row in csv.reader(io.StringIO(raw)):
              if row and row[0].strip().upper() == 'JPY':
                  jpy = row
                  break
          if not jpy or len(jpy) < 14:
              raise SystemExit('JPY row not found or Taiwan Bank CSV format changed')

          # Taiwan Bank CSV selling-side fields: [12] cash sell, [13] spot sell.
          cash_sell = float(jpy[12].strip())
          spot_sell = float(jpy[13].strip())
          tz = timezone(timedelta(hours=8))
          updated = datetime.now(tz).strftime('%Y/%m/%d %H:%M:%S')

          data = {
              'currency': 'JPY',
              'cashSell': cash_sell,
              'spotSell': spot_sell,
              'updatedAt': updated,
              'source': '臺灣銀行',
              'sourceUrl': 'https://rate.bot.com.tw/xrt?Lang=zh-TW'
          }
          Path('rate.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(data, ensure_ascii=False))

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html rate.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix Taiwan Bank JPY rate update"
          git push
