name: Update Taiwan Bank JPY rate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-bot-rate.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: update-bot-rate
  cancel-in-progress: true

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Taiwan Bank JPY rate
        shell: python
        run: |
          import csv
          import io
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          url = 'https://rate.bot.com.tw/xrt/flcsv/0/day'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as response:
              raw = response.read().decode('utf-8-sig')

          jpy = None
          for row in csv.reader(io.StringIO(raw)):
              if row and row[0].strip().upper() == 'JPY':
                  jpy = row
                  break

          if not jpy or len(jpy) < 14:
              raise RuntimeError('找不到臺灣銀行 JPY 資料，或 CSV 格式已變更')

          # 臺灣銀行 CSV: [12] 現金賣出、[13] 即期賣出。
          cash_sell = float(jpy[12].strip().replace(',', ''))
          spot_sell = float(jpy[13].strip().replace(',', ''))

          if not (0 < cash_sell < 10 and 0 < spot_sell < 10):
              raise RuntimeError(f'匯率數值異常: cashSell={cash_sell}, spotSell={spot_sell}')

          tz = timezone(timedelta(hours=8))
          data = {
              'currency': 'JPY',
              'cashSell': cash_sell,
              'spotSell': spot_sell,
              'updatedAt': datetime.now(tz).strftime('%Y/%m/%d %H:%M:%S'),
              'source': '臺灣銀行',
              'sourceUrl': 'https://rate.bot.com.tw/xrt?Lang=zh-TW'
          }

          Path('rate.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print(json.dumps(data, ensure_ascii=False))

      - name: Commit updated rate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rate.json
          if git diff --cached --quiet; then
            echo '匯率沒有變化，不需要提交。'
            exit 0
          fi
          git commit -m "Update Taiwan Bank JPY rate"
          git push
