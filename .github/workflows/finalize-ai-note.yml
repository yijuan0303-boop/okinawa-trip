name: Finalize itinerary UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ github.event.head_commit.message != '完成 AI 行程助手介面清理' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove API note
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'Google Maps\s*/\s*Routes API 接上後，可自動取得距離、時間與公車路線。', '地圖與導航直接開啟 Google Maps。', s)
          s = re.sub(r'接上 Google Places\s*/\s*Routes API 後，可自動取得距離、時間與公車路線。', '地圖與導航直接開啟 Google Maps。', s)
          s = re.sub(r'目前先以行程助手介面與既有沖繩資料做預覽；Google Places\s*/\s*Routes API 尚未在前端放置 API Key。', '目前先以既有沖繩資料做行程預覽，地圖與導航直接開啟 Google Maps。', s)
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove temporary cleanup workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '完成 AI 行程助手介面清理' || exit 0
          git push
          git rm .github/workflows/finalize-ai-note.yml
          git commit -m '移除一次性 AI 行程助手清理工作流'
          git push
