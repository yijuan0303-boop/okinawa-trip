name: One-time remove rate alert

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Taiwan Bank rate alert
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(
              r"\\s*alert\\('目前無法取得臺銀最新匯率，已保留上次成功更新的資料。'\\);",
              "\\n             console.warn('目前無法取得臺銀最新匯率，已保留上次成功更新的資料。');",
              s,
          )
          if s2 == s:
              print('No matching rate alert found; leaving index.html unchanged.')
          else:
              p.write_text(s2, encoding='utf-8')
              print('Removed Taiwan Bank rate alert.')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/remove-rate-alert.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-rate-alert.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Remove exchange rate alert dialog"
            git push
          fi
