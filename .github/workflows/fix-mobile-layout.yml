name: Fix mobile app layout
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n    html, body { width:100%; height:100%; min-height:100%; margin:0; overflow:hidden; }\n    body { min-height:100dvh; height:100dvh; }\n    #app { height:100dvh; min-height:100dvh !important; max-height:100dvh; }\n    #app > main { min-height:0; }\n'''
          s = s.replace('  <style>\n', '  <style>' + css, 1)
          s = s.replace('min-h-screen flex flex-col relative shadow-[0_0_50px_rgba(0,0,0,0.06)]', 'h-[100dvh] min-h-[100dvh] max-h-[100dvh] flex flex-col relative shadow-[0_0_50px_rgba(0,0,0,0.06)]', 1)
          s = s.replace('<main class="flex-1 overflow-y-auto', '<main class="flex-1 min-h-0 overflow-y-auto', 1)
          s = s.replace('class="fixed bottom-0 max-w-md w-full bottom-glass', 'class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-md w-full bottom-glass', 1)
          s = re.sub(r'\n\s*\.emergency-contact\{cursor:default;user-select:text\}\.zoom-controls\{.*?\.zoom-level\{.*?\}\n', '\n    .emergency-contact{cursor:default;user-select:text}\n', s, count=1, flags=re.S)
          s = re.sub(r'\n\s*<div class="zoom-controls" aria-label="畫面縮放">.*?</div>\n', '\n', s, count=1, flags=re.S)
          s = s.replace(' :style="{ zoom: uiZoom }"', '')
          s = re.sub(r'\n\s*const uiZoom = ref\(Number\(localStorage\.getItem\(\'oki_ui_zoom\'\) \|\| 1\)\);\n\s*const adjustZoom = .*?\n\s*const resetZoom = .*?;\n', '\n', s, count=1, flags=re.S)
          s = s.replace('currentTab, uiZoom, adjustZoom, resetZoom, activeDay,', 'currentTab, activeDay,')
          s = re.sub(r'\n\s*<!-- ================= 頁籤 3: 日本名店折價券.*?\n\s*<!-- ================= 頁籤 4: 分帳 ================= -->', '\n\n      <!-- ================= 頁籤 3: 分帳 ================= -->', s, count=1, flags=re.S)
          s = re.sub(r'\n\s*<button @click="currentTab = \'coupons\'".*?</button>', '', s, count=1)
          s = re.sub(r'\n\s*<!-- Modal: 新增 / 編輯優惠券 -->.*?\n\s*<!-- Modal: 離線條碼視窗 -->', '\n', s, count=1, flags=re.S)
          s = re.sub(r'\n\s*<!-- Modal: 離線條碼視窗 -->.*?\n\s*<!-- Modal: 新增／修改記帳 -->', '\n\n    <!-- Modal: 新增／修改記帳 -->', s, count=1, flags=re.S)
          map_section = r'''\n\n      <!-- ================= 地圖 ================= -->\n      <section v-if="currentTab === 'map'" class="space-y-5">\n        <div class="px-1 pt-1">\n          <div class="text-[10px] tracking-[.22em] text-stone-400 font-bold uppercase">TRIP MAP</div>\n          <h2 class="editorial-title text-[30px] text-[#183F46] mt-1">沖繩地圖</h2>\n          <p class="text-[11px] text-stone-400 mt-2">行程景點 × 一鍵導航 × 每日路線</p>\n        </div>\n        <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar pb-1">\n          <button v-for="d in 4" :key="d" @click="activeDay = d" :class="activeDay === d ? 'bg-[#183F46] text-white' : 'bg-white text-stone-500 border border-stone-200'" class="flex-none px-4 py-2.5 rounded-full text-[10px] font-bold">DAY {{ d }} · {{ getDayNumber(d) }}</button>\n        </div>\n        <div class="bg-[#183F46] text-white rounded-[26px] p-4 relative overflow-hidden">\n          <div class="relative z-10">\n            <div class="text-[9px] tracking-[.2em] opacity-70 uppercase">DAY {{ activeDay }} ROUTE</div>\n            <div class="editorial-title text-[23px] mt-1">{{ getDayStrategy(activeDay).title }}</div>\n            <div class="text-[10px] text-white/70 mt-2 leading-relaxed">{{ getDayStrategy(activeDay).desc }}</div>\n          </div>\n          <div class="island-glow"></div>\n        </div>\n        <div class="space-y-2.5">\n          <div v-for="(item, idx) in currentDayItinerary" :key="idx" class="bg-white border border-stone-200 rounded-2xl p-4">\n            <div class="flex items-start gap-3">\n              <div class="w-10 h-10 rounded-xl bg-[#DDEDEA] text-[#183F46] flex items-center justify-center shrink-0"><i :class="getTransportIcon(item.transitMode)"></i></div>\n              <div class="min-w-0 flex-1">\n                <div class="text-[9px] text-stone-400 font-mono">{{ item.time }} · {{ item.locationHint }}</div>\n                <div class="text-[15px] font-black text-[#183F46] mt-1 leading-tight">{{ item.title }}</div>\n                <div class="text-[10px] text-stone-500 mt-1.5 leading-relaxed">{{ item.note }}</div>\n                <div class="flex gap-2 mt-3">\n                  <a :href="'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(item.title + ' 沖縄') + '&travelmode=transit'" target="_blank" rel="noopener noreferrer" class="flex-1 py-2.5 rounded-xl bg-[#183F46] text-white text-[10px] font-black text-center"><i class="fa-solid fa-location-arrow mr-1"></i>開始導航</a>\n                  <a :href="'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.title + ' 沖縄')" target="_blank" rel="noopener noreferrer" class="flex-1 py-2.5 rounded-xl bg-[#DDEDEA] text-[#183F46] text-[10px] font-black text-center"><i class="fa-solid fa-map-location-dot mr-1"></i>開啟地圖</a>\n                </div>\n              </div>\n            </div>\n          </div>\n        </div>\n        <div class="bg-white border border-stone-200 rounded-2xl p-4">\n          <div class="text-[10px] font-black text-[#183F46]">常用地點</div>\n          <div class="grid grid-cols-2 gap-2 mt-3">\n            <a v-for="place in ['Naha West Inn','Pokémon Center Okinawa','SAN-A PARCO CITY','AEON MALL Okinawa Rycom']" :key="place" :href="'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(place + ' 沖縄')" target="_blank" rel="noopener noreferrer" class="py-2.5 px-2 rounded-xl bg-[#F7F6F0] text-[#183F46] text-[9px] font-bold text-center border border-stone-100">{{ place }}</a>\n          </div>\n        </div>\n      </section>\n'''
          marker = '\n\n      <!-- ================= 頁籤 4: 分帳 ================= -->'
          if "currentTab === 'map'" not in s:
              s = s.replace(marker, map_section + marker, 1)
          old = '<button @click="currentTab = \'coupons\'" :class="currentTab === \'coupons\' ? \'text-[#183F46] font-bold scale-105\' : \'text-stone-400\'" class="flex flex-col items-center flex-1 py-1 transition duration-150"><i class="fa-solid fa-ticket text-base"></i><span class="text-[10px] mt-1">優惠券</span></button>'
          new = '<button @click="currentTab = \'map\'" :class="currentTab === \'map\' ? \'text-[#183F46] font-bold scale-105\' : \'text-stone-400\'" class="flex flex-col items-center flex-1 py-1 transition duration-150"><i class="fa-solid fa-map-location-dot text-base"></i><span class="text-[10px] mt-1">地圖</span></button>'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('patched', len(s), 'bytes')
      - name: Validate
        run: |
          test -s index.html
          ! grep -q 'zoom-controls' index.html
          ! grep -q "currentTab = 'coupons'" index.html
          grep -q "currentTab === 'map'" index.html
          grep -q '100dvh' index.html
      - name: Commit and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-mobile-layout.yml
          git commit -m "Make mobile app viewport-fit and add map tab"
          git push origin main
