name: Repair RWD layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile-first RWD
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove any old page-level zoom/scale implementation.
          s = re.sub(r'\n?[^\n{}]*zoom\s*:\s*[^;{}]+;[^\n]*', '', s, flags=re.I)
          s = s.replace('maximum-scale=5.0, user-scalable=yes, ', '')

          # Replace the old fixed-height / fixed-width RWD block with true fluid layout rules.
          old = re.compile(r'\n\s*/\* RWD: mobile fills the viewport; wider screens use a centered reading column\. \*/.*?\n\s*</style>', re.S)
          new = r'''

          /* True mobile-first RWD: the page itself is fluid, never a scaled canvas. */
          html, body {
            width: 100%;
            min-width: 0;
            min-height: 100%;
            margin: 0;
          }
          body {
            overflow-x: hidden;
            overflow-y: auto;
            display: block !important;
          }
          #app {
            width: 100% !important;
            max-width: none !important;
            min-width: 0 !important;
            min-height: 100dvh;
            height: auto !important;
            max-height: none !important;
            margin: 0 !important;
            border-left: 0;
            border-right: 0;
            border-radius: 0;
            overflow: visible !important;
          }
          #app > main {
            min-height: 0;
            overflow: visible !important;
          }
          nav.fixed {
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100% !important;
            max-width: none !important;
            transform: none !important;
          }

          /* Keep comfortable reading width on larger screens, but never shrink mobile into a tiny card. */
          @media screen and (min-width: 768px) {
            body {
              overflow-x: hidden;
              background: #f7f6f0;
            }
            #app {
              width: min(100%, 1100px) !important;
              max-width: 1100px !important;
              min-height: 100dvh;
              margin: 0 auto !important;
              border-left: 1px solid #e7e5e4;
              border-right: 1px solid #e7e5e4;
            }
            nav.fixed {
              width: min(100%, 1100px) !important;
              max-width: 1100px !important;
              left: 50% !important;
              right: auto !important;
              transform: translateX(-50%) !important;
            }
          }

          /* Small phones: use the actual viewport width and keep everything readable. */
          @media screen and (max-width: 767px) {
            html, body { width: 100%; }
            #app { width: 100% !important; max-width: none !important; }
            main { overflow: visible !important; }
          }
          </style>'''
          s2, n = old.subn(new, s, count=1)
          if n != 1:
              raise SystemExit('RWD block not found; aborting to avoid damaging index.html')
          s = s2

          # Remove fixed max-width utility classes from the main app/nav so they cannot fight RWD CSS.
          s = s.replace(' w-full max-w-md bg-[#f7f6f0] h-[100dvh]', ' w-full bg-[#f7f6f0]')
          s = s.replace(' fixed bottom-0 max-w-md w-full ', ' fixed bottom-0 w-full ')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- index.html

      - name: Commit repaired layout and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/rwd-mobile-fix.yml
          git commit -m "Fix mobile-first responsive layout"
          git push
