name: Restore known-good site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good index
        run: |
          git checkout 77112c49538f44a8ba3f8f282eabb0af7ba8e504 -- index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore complete trip information' || true
          git push
          git rm .github/workflows/restore-known-good.yml
          git commit -m 'Remove temporary restore workflow'
          git push
