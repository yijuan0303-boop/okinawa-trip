name: Repair trip planner UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repair script
        run: python3 repair_trip.py
      - name: Commit repaired app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/repair-trip.yml repair_trip.py
          git add index.html
          git commit -m 'Repair trip planner UI'
          git push
