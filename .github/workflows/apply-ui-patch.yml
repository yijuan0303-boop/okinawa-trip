name: Apply one-time UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!startsWith(github.event.head_commit.message, 'Apply UI patch')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch and validate
        run: python3 scripts/apply_ui_patch_v2.py

      - name: Commit patched site and remove one-time files
        run: |
          rm -f scripts/apply_ui_patch.py scripts/apply_ui_patch_v2.py .github/workflows/apply-ui-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/apply_ui_patch.py scripts/apply_ui_patch_v2.py .github/workflows/apply-ui-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Apply UI patch'
          git push
