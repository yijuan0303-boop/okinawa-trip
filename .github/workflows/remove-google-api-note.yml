name: Remove Google API note

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove API note and make Maps wording explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '目前是前端 AI 行程助手預覽；正式串接 Google Places / Routes API 時，再由後端安全保存 API Key。'
          new = '目前是前端 AI 行程助手預覽；地圖與導航直接開啟 Google Maps，不使用 Google API。'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use zero-API Google Maps links' || exit 0
          git push
