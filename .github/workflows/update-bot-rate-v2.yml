name: Taiwan Bank JPY rate updater v2

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Taiwan Bank JPY rate
        shell: python
        run: |
          import json, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          url = 'https://raw.githubusercontent.com/haotool/app/data/public/rates/latest.json'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              src = json.loads(r.read().decode('utf-8', errors='replace'))
          jpy = src.get('details', {}).get('JPY', {})
          spot = jpy.get('spot', {}).get('sell')
          cash = jpy.get('cash', {}).get('sell')
          if not isinstance(spot, (int, float)) or not isinstance(cash, (int, float)):
              raise SystemExit('Taiwan Bank JPY rate not found')
          updated = src.get('updateTime') or datetime.now(timezone(timedelta(hours=8))).strftime('%Y/%m/%d %H:%M:%S')
          data = {
              'currency': 'JPY',
              'cashSell': float(cash),
              'spotSell': float(spot),
              'updatedAt': updated,
              'source': '臺灣銀行',
              'sourceUrl': 'https://rate.bot.com.tw/xrt?Lang=zh-TW',
              'transport': 'Taiwan Bank data mirror (HaoRate providerId=bot)'
          }
          Path('rate.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(data, ensure_ascii=False))
      - name: Commit rate only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rate.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Taiwan Bank JPY rate'
          git push
