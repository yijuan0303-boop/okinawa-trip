name: Taiwan Bank JPY rate updater v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore preferred editorial UI and apply final changes
        shell: python
        run: |
          from pathlib import Path
          import subprocess, re

          subprocess.run(['git','show','0044a6a2946174def5cadf8268936049dc724668:index.html'], check=True, stdout=open('index.html','wb'))
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Keep the preferred compact whole-page composition, without any visible zoom controls.
          s=s.replace('<div id="app" class="w-full max-w-md', '<div id="app" style="zoom:.76" class="w-full max-w-md', 1)

          # Remove custom zoom UI and zoom state. Native browser/device zoom remains available.
          s=re.sub(r'\n\s*\.zoom-controls\{[^}]*\}\.zoom-btn\{[^}]*\}\.zoom-level\{[^}]*\}', '', s)
          s=re.sub(r'\n\s*<div class="zoom-controls"[\s\S]*?</div>\s*\n', '\n', s, count=1)
          s=s.replace(':style="{ zoom: uiZoom }" ', '')
          s=re.sub(r'\n\s*const uiZoom = ref\([^\n]+\);', '', s)
          s=re.sub(r'\n\s*const adjustZoom = \(delta\) => \{[^\n]+\};', '', s)
          s=re.sub(r'\n\s*const resetZoom = \(\) => \{[^\n]+\};', '', s)
          s=s.replace('uiZoom, adjustZoom, resetZoom,','')

          # Remove the visible coupon page.
          a=s.find('<!-- ================= 頁籤 3: 日本名店折價券')
          b=s.find('<!-- ================= 頁籤 4: 分帳 ================= -->')
          if a!=-1 and b!=-1:
              s=s[:a]+s[b:]
          s=re.sub(r'\n\s*<button @click="currentTab = \'coupons\'"[\s\S]*?</button>', '', s, count=1)

          # Add map page before expenses.
          marker='<!-- ================= 頁籤 4: 分帳 ================= -->'
          block='''<!-- ================= 頁籤 3: 地圖 ================= -->
      <section v-if="currentTab === 'overview' || currentTab === 'map'" class="space-y-5">
        <div class="px-1 pt-1"><div class="text-[10px] tracking-[.22em] text-stone-400 font-bold uppercase">TRIP MAP</div><h2 class="editorial-title text-[30px] text-[#183F46] mt-1">沖繩地圖</h2><p class="text-[11px] text-stone-400 mt-2">行程地點、百貨、住宿一鍵開啟 Google Maps</p></div>
        <div class="rounded-[28px] bg-[#183F46] text-white p-5 relative overflow-hidden"><div class="relative z-10"><div class="text-[9px] tracking-[.25em] opacity-70">OKINAWA · MAP JOURNAL</div><div class="editorial-title text-[25px] mt-2">今天要去哪裡？</div><div class="text-[11px] opacity-75 mt-2">直接點選地點，就會開啟 Google Maps 導航。</div><div class="flex gap-2 mt-4 flex-wrap"><a href="https://www.google.com/maps/search/?api=1&query=那霸WEST+INN+沖繩" target="_blank" rel="noopener noreferrer" class="px-3 py-2 rounded-full bg-white/10 border border-white/20 text-[10px] font-bold">住宿</a><a href="https://www.google.com/maps/search/?api=1&query=SAN-A+浦添西海岸+PARCO+CITY" target="_blank" rel="noopener noreferrer" class="px-3 py-2 rounded-full bg-white/10 border border-white/20 text-[10px] font-bold">PARCO CITY</a><a href="https://www.google.com/maps/search/?api=1&query=AEON+MALL+沖縄ライカム" target="_blank" rel="noopener noreferrer" class="px-3 py-2 rounded-full bg-white/10 border border-white/20 text-[10px] font-bold">Rycom</a></div></div><div class="island-glow"></div></div>
        <div class="bg-white rounded-[24px] border border-stone-200 p-4"><div class="flex items-center justify-between mb-3"><div><div class="text-sm font-black text-[#183F46]">每日行程地圖</div><div class="text-[9px] text-stone-400 mt-1">選擇日期查看當天所有行程點</div></div><a :href="'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent((currentDayItinerary.length ? currentDayItinerary[currentDayItinerary.length-1].title : '那霸沖繩') + ' 沖繩')" target="_blank" rel="noopener noreferrer" class="text-[10px] font-black text-[#183F46] border border-stone-200 rounded-full px-3 py-2">開啟導航</a></div><div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1"><button v-for="d in 4" :key="d" @click="activeDay=d" :class="activeDay===d ? 'bg-[#183F46] text-white' : 'bg-stone-50 text-stone-500 border border-stone-200'" class="shrink-0 px-4 py-2 rounded-full text-[10px] font-bold">DAY {{ d }}</button></div></div>
        <div class="space-y-2"><a v-for="(item,idx) in currentDayItinerary" :key="item.id || idx" :href="mapSearchUrl(item.title)" target="_blank" rel="noopener noreferrer" class="block bg-white border border-stone-200 rounded-2xl p-4 hover:border-[#78B6B2] transition"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-2xl bg-[#DDEDEA] text-[#183F46] flex items-center justify-center shrink-0"><i class="fa-solid fa-location-dot"></i></div><div class="min-w-0 flex-1"><div class="text-[9px] text-stone-400 font-mono">{{ item.time }}</div><div class="text-sm font-black text-[#183F46] mt-1">{{ item.title }}</div><div class="text-[10px] text-stone-400 mt-1 truncate">{{ item.locationHint || item.transitMode }}</div></div><i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-stone-300"></i></div></a></div>
        <div class="bg-white rounded-[24px] border border-stone-200 p-4 space-y-2"><div class="text-sm font-black text-[#183F46] mb-3">固定地點</div><a href="https://www.google.com/maps/search/?api=1&query=那霸WEST+INN+沖繩" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between p-3 bg-stone-50 rounded-xl"><span><b class="text-xs text-[#183F46]">Naha West Inn</b><small class="block text-[9px] text-stone-400 mt-1">那霸市西1-16-7</small></span><i class="fa-solid fa-location-arrow text-[#78B6B2]"></i></a><a href="https://www.google.com/maps/search/?api=1&query=SAN-A+浦添西海岸+PARCO+CITY" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between p-3 bg-stone-50 rounded-xl"><span><b class="text-xs text-[#183F46]">SAN-A 浦添西海岸 PARCO CITY</b><small class="block text-[9px] text-stone-400 mt-1">百貨・3C／EDION</small></span><i class="fa-solid fa-location-arrow text-[#78B6B2]"></i></a><a href="https://www.google.com/maps/search/?api=1&query=AEON+MALL+沖縄ライカム" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between p-3 bg-stone-50 rounded-xl"><span><b class="text-xs text-[#183F46]">AEON MALL Okinawa Rycom</b><small class="block text-[9px] text-stone-400 mt-1">百貨・3C／KOJIMA × Bic Camera</small></span><i class="fa-solid fa-location-arrow text-[#78B6B2]"></i></a></div>
      </section>

      <!-- ================= 頁籤 4: 分帳 ================= -->'''
          if marker in s and "currentTab === 'map'" not in s:
              s=s.replace(marker,block,1)

          needle="""        const currentDayItinerary = computed(() => {\n          return itineraryList.value.filter(item => item.day === activeDay.value);\n        });\n"""
          if needle in s and 'const mapSearchUrl' not in s:
              s=s.replace(needle,needle+"        const mapSearchUrl = (title) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((title || '沖繩') + ' 沖繩');\n",1)
          s=s.replace('getDayNoticeIcon, getTransportIcon, getTransportPillStyle, getPackingByCat, getShopCategory, getCategoryColor, getCategoryIcon,','getDayNoticeIcon, getTransportIcon, getTransportPillStyle, getPackingByCat, getShopCategory, getCategoryColor, getCategoryIcon, mapSearchUrl,',1)
          p.write_text(s,encoding='utf-8')
          assert 'zoom-controls' not in s and 'uiZoom' not in s
          assert "currentTab === 'map'" in s and 'mapSearchUrl' in s
          assert '優惠券</span>' not in s

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/rebuild-trip-ui.yml .github/workflows/rebuild-trip-ui2.yml ui-rebuild-trigger.txt ui-rebuild-trigger-2.txt .github/workflows/apply-ui-fix.yml ui-trigger.txt
          git add index.html rate.json .github/workflows/update-bot-rate-v2.yml .github/workflows/rebuild-trip-ui.yml .github/workflows/rebuild-trip-ui2.yml ui-rebuild-trigger.txt ui-rebuild-trigger-2.txt .github/workflows/apply-ui-fix.yml ui-trigger.txt
          git commit -m 'Restore compact editorial UI and map tab'
          git push
