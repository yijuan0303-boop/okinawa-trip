name: Taiwan Bank JPY rate updater v2

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update rate and make overview show all pages
        shell: python
        run: |
          import json, re, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          # 1) Update Taiwan Bank JPY rate data only in rate.json.
          url = 'https://raw.githubusercontent.com/haotool/app/data/public/rates/latest.json'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              src = json.loads(r.read().decode('utf-8', errors='replace'))
          jpy = src.get('details', {}).get('JPY', {})
          spot = jpy.get('spot', {}).get('sell')
          cash = jpy.get('cash', {}).get('sell')
          if not isinstance(spot, (int, float)) or not isinstance(cash, (int, float)):
              raise SystemExit('Taiwan Bank JPY rate not found')
          updated = src.get('updateTime') or datetime.now(timezone(timedelta(hours=8))).strftime('%Y/%m/%d %H:%M:%S')
          Path('rate.json').write_text(
              json.dumps({
                  'currency': 'JPY',
                  'cashSell': float(cash),
                  'spotSell': float(spot),
                  'updatedAt': updated,
                  'source': '臺灣銀行',
                  'sourceUrl': 'https://rate.bot.com.tw/xrt?Lang=zh-TW',
                  'transport': 'Taiwan Bank data mirror (HaoRate providerId=bot)'
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          # 2) Disable browser alert popups without touching the rest of the UI.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          alert_script = '<script>window.alert = function() {};</script>'
          if alert_script not in s:
              body = '<body class="flex justify-center min-h-screen">'
              s = s.replace(body, body + '\n' + alert_script, 1)

          # 3) IMPORTANT: Overview means ALL existing page sections are visible together.
          # Keep the original sections and their contents intact; only broaden their v-if.
          tabs = ['itinerary', 'malls', 'guide', 'finance', 'coupons']
          for tab in tabs:
              pattern = rf'v-if="currentTab === \'{tab}\'"'
              replacement = f'v-if="currentTab === \'overview\' || currentTab === \'{tab}\'"'
              s = re.sub(pattern, replacement, s, count=1)

          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rate.json index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show all page content in overview'
          git push
