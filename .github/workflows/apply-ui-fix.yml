name: Apply compact travel layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Compact editorial scale: no visible zoom controls, but preserve the preferred whole-page composition.
          if '<div id="app" style="zoom:.76"' not in s:
              s = s.replace('<div id="app" class="w-full max-w-md', '<div id="app" style="zoom:.76" class="w-full max-w-md', 1)
          # Ensure coupons are not visible in navigation.
          old_nav = '''      <button @click="currentTab = 'coupons'" :class="currentTab === 'coupons' ? 'text-[#183F46] font-bold scale-105' : 'text-stone-400'" class="flex flex-col items-center flex-1 py-1 transition duration-150"><i class="fa-solid fa-ticket text-base"></i><span class="text-[10px] mt-1">優惠券</span></button>'''
          s = s.replace(old_nav, '''      <button @click="currentTab = 'map'" :class="currentTab === 'map' ? 'text-[#183F46] font-bold scale-105' : 'text-stone-400'" class="flex flex-col items-center flex-1 py-1 transition duration-150"><i class="fa-solid fa-map-location-dot text-base"></i><span class="text-[10px] mt-1">地圖</span></button>''')
          # Remove the temporary trigger file.
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore compact editorial layout"
            git push
          fi
      - name: Cleanup temporary files
        run: |
          if [ -f ui-trigger.txt ]; then git rm ui-trigger.txt; fi
          if [ -f .github/workflows/apply-ui-fix.yml ]; then git rm .github/workflows/apply-ui-fix.yml; fi
          if ! git diff --cached --quiet; then
            git commit -m "Cleanup temporary UI workflow"
            git push
          fi
