name: One-time map nav

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add map nav
        run: python patch_map_nav.py
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f patch_map_nav.py .github/workflows/one-time-map-nav.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add map navigation tab'
          git push
