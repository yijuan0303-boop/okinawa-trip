<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>沖繩行程編輯｜版本 A</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f6f0;color:#202424;font-family:Arial,'Noto Sans TC',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:680px;margin:auto;min-height:100dvh;padding:22px 16px 100px}.k{font-size:10px;letter-spacing:.24em;color:#78b6b2;font-weight:800}.title{font:400 34px Georgia,'Noto Serif TC',serif;color:#183f46;margin:7px 0 4px}.sub{font-size:11px;color:#8a9390}.day{display:flex;gap:8px;overflow:auto;margin:18px 0}.day button{border:0;background:white;color:#7b8582;border-radius:999px;padding:9px 15px;font-weight:800;font-size:11px;white-space:nowrap}.day button.on{background:#183f46;color:white}.card{background:white;border:1px solid #e2e6e4;border-radius:24px;padding:16px;margin:10px 0;box-shadow:0 8px 22px #183f4608}.head{display:flex;align-items:flex-start;gap:12px}.time{width:58px;color:#183f46;font-weight:900;font-family:monospace;font-size:16px}.body{flex:1}.name{font-weight:900;color:#183f46;font-size:16px}.hint{font-size:10px;color:#8b9491;margin-top:4px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{background:#eef6f4;color:#183f46;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:800}.actions{display:flex;gap:6px;margin-top:12px}.actions button{border:1px solid #dfe5e2;background:#fff;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:800;color:#183f46}.route{margin:0 0 0 70px;border-left:1px dashed #cdd7d4;padding:3px 0 8px 15px;color:#7a8582;font-size:9px}.route b{color:#183f46}.fab{position:fixed;right:20px;bottom:24px;border:0;background:#183f46;color:#fff;border-radius:999px;padding:13px 18px;font-weight:900;box-shadow:0 10px 28px #183f4650}.sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;padding:0}.sheet.show{display:flex}.panel{width:min(680px,100%);max-height:92dvh;overflow:auto;background:white;border-radius:28px 28px 0 0;padding:20px}.grab{width:38px;height:4px;border-radius:4px;background:#d7ddda;margin:0 auto 15px}.panel h2{font:700 22px Georgia;color:#183f46;margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:9px;font-weight:900;color:#78837f;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #dfe5e2;border-radius:13px;background:#f8f9f7;outline:none}.full{grid-column:1/-1}.google{background:#eef6f4;border:1px solid #d4e8e4;border-radius:16px;padding:11px;font-size:10px;color:#183f46;margin:12px 0}.foot{display:flex;gap:8px;margin-top:14px}.foot button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:900}.cancel{background:#eef0ee}.save{background:#183f46;color:white}@media(max-width:480px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.time{width:50px}.route{margin-left:62px}}</style></head><body><main class="app"><div class="k">ITINERARY EDITOR · VERSION A</div><div class="title">行程卡片＋編輯抽屜</div><div class="sub">把「到達、停留、下一站移動」拆清楚，新增行程也沿用同一套結構。</div><div class="day"><button class="on">DAY 3 · 10/25</button><button>DAY 1</button><button>DAY 2</button><button>DAY 4</button></div><div id="list"></div></main><button class="fab" onclick="openNew()">＋ 新增行程</button><div class="sheet" id="sheet"><section class="panel"><div class="grab"></div><h2 id="modalTitle">修改行程</h2><div class="grid"><div class="field full"><label>地點</label><input id="name"></div><div class="field"><label>抵達時間</label><input id="arrive" type="time"></div><div class="field"><label>停留多久</label><input id="stay" placeholder="例如 1 小時"></div><div class="field"><label>移動方式</label><select id="mode"><option>計程車</option><option>單軌電車</option><option>大眾運輸</option><option>徒步</option><option>觀光巴士</option></select></div><div class="field"><label>前往下站時間</label><input id="travel" placeholder="例如 20 分鐘"></div><div class="field"><label>距離</label><input id="dist" placeholder="例如 12.8 km"></div><div class="field full"><label>地點提示</label><input id="hint" placeholder="例如 永旺夢樂城來客夢 1F"></div></div><div class="google">🗺️ <b>Google Maps 建議資料</b><br>之後可用 Google Maps Routes API 自動帶入「距離＋預估行車時間」，但保留手動修改欄位；使用者改過的值不會被自動覆蓋。</div><div class="foot"><button class="cancel" onclick="closeSheet()">取消</button><button class="save" onclick="save()">儲存</button></div></section></div><script>const data=[{name:'波上宮',arrive:'09:14',stay:'50 分鐘',mode:'計程車',travel:'25 分鐘',dist:'17.2 km',hint:'若狹海邊斷崖'},{name:'沖繩寶可夢中心',arrive:'10:54',stay:'1 小時',mode:'計程車',travel:'20 分鐘',dist:'12.8 km',hint:'永旺夢樂城來客夢 1F'},{name:'PARCO CITY',arrive:'12:19',stay:'2.5 小時',mode:'計程車',travel:'15 分鐘',dist:'9.3 km',hint:'浦添西海岸海景商城'}];let edit=-1;function render(){document.getElementById('list').innerHTML=data.map((x,i)=>`<div class="card"><div class="head"><div class="time">${x.arrive}</div><div class="body"><div class="name">${x.name}</div><div class="hint">${x.hint}</div><div class="chips"><span class="chip">停留 ${x.stay}</span><span class="chip">${x.mode}</span><span class="chip">→ ${x.travel}</span><span class="chip">${x.dist}</span></div><div class="actions"><button onclick="editItem(${i})">✎ 修改</button><button onclick="maps(${i})">↗ Google Maps</button></div></div></div></div>${i<data.length-1?`<div class="route">下一站移動 · <b>${x.mode} ${x.travel}</b> · ${x.dist}</div>`:''}`).join('')}function editItem(i){edit=i;const x=data[i];modal(x,'修改行程')}function openNew(){edit=-1;modal({name:'',arrive:'12:00',stay:'1 小時',mode:'計程車',travel:'20 分鐘',dist:'',hint:''},'新增行程')}function modal(x,t){modalTitle.textContent=t;name.value=x.name;arrive.value=x.arrive;stay.value=x.stay;mode.value=x.mode;travel.value=x.travel;dist.value=x.dist;hint.value=x.hint;sheet.classList.add('show')}function closeSheet(){sheet.classList.remove('show')}function save(){const x={name:name.value,arrive:arrive.value,stay:stay.value,mode:mode.value,travel:travel.value,dist:dist.value,hint:hint.value};if(edit<0)data.push(x);else data[edit]=x;render();closeSheet()}function maps(i){window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(data[i].name+' 沖繩'),'_blank')}render()</script></body></html>
